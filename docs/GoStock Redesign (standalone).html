document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

02Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:#3D372F\">A ficha do SKU abre num painel lateral sem tirar o usuário da lista, com cobertura, data de ruptura, lead time do fornecedor e projeção com a campanha marcada.<\u002Fdiv><\u002Fdiv><div style=\"font-size:14px;line-height:1.5;font-weight:600;background:#F3E9F1;color:#3E1A3A;border-radius:12px;padding:12px 14px\">A tabela de 500 linhas continua longa, mas cada linha agora se lê em um relance. A projeção da ficha é um esquema.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n<!-- 1e -->\n<div id=\"1e\" style=\"display:grid;grid-template-columns:1280px 340px;gap:12px 32px;flex:none;width:1652px\">\n<div style=\"grid-column:1/-1;font-size:14px;font-weight:700\"><span style=\"background:#5B2A55;color:#fff;border-radius:6px;padding:3px 8px;margin-right:8px\">1e<\u002Fspan>Fornecedores<\u002Fdiv>\n<div style=\"width:1280px;min-height:860px;background:#FAF8F5;border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 12px 40px rgba(60,40,20,.12);display:flex;overflow:hidden;color:#1C1917\">\n<div style=\"width:232px;flex:none;background:#fff;border-right:1px solid #EAE5DE;padding:24px 16px;display:flex;flex-direction:column;gap:4px;box-sizing:border-box\">\n<div style=\"font-size:20px;font-weight:800;letter-spacing:-.02em;padding:0 12px 20px\">GoStock<\u002Fdiv>\n<sc-for list=\"{{ nav5 }}\" as=\"n\" hint-placeholder-count=\"6\"><div style=\"display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;font-size:15px;font-weight:{{ n.w }};background:{{ n.bg }};color:{{ n.c }}\"><span>{{ n.label }}<\u002Fspan><span style=\"display:{{ n.cd }};font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:{{ n.pb }};color:{{ n.pc }}\">{{ n.count }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<div style=\"margin-top:auto;padding:14px;border-radius:12px;background:#F5F1EB;font-size:13px;line-height:1.45;color:#5E564E\"><div style=\"font-weight:700;color:#1C1917\">Dados padrão<\u002Fdiv>Referência 29/09/2026<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1;padding:36px 40px;display:flex;flex-direction:column;gap:20px;min-width:0\">\n<div><h2 style=\"font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0\">Fornecedores<\u002Fh2><div style=\"font-size:15px;color:#6F675F;margin-top:6px\">Lead time medido nos pedidos recebidos (recebimento − pedido).<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#FEF1DC;border-radius:16px;padding:16px 20px;display:flex;gap:14px;align-items:flex-start\"><div style=\"width:28px;height:28px;border-radius:99px;background:#D9780F;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none\">!<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.5;color:#4A2E08\"><b>F05 é instável:<\u002Fb> o P90 é mais de 1,8× a mediana. O plano usa a mediana para a chegada; o agente antecipa emissões quando a chegada pelo P90 cai depois do início da campanha.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px\">\n<div style=\"background:#fff;border:1px solid #EAE5DE;border-radius:16px;padding:18px 22px\"><div style=\"font-size:13px;color:#6F675F\">POs em aberto<\u002Fdiv><div style=\"font-size:30px;font-weight:800;margin-top:4px\">90<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #EAE5DE;border-radius:16px;padding:18px 22px\"><div style=\"font-size:13px;color:#6F675F\">Atrasados<span class=\"tt\" style=\"display:inline-flex;width:16px;height:16px;border-radius:99px;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-left:6px;cursor:help;text-transform:none;letter-spacing:0;vertical-align:middle;background:#EAE5DE;color:#5E564E\">i<span class=\"tip \">POs em aberto cuja chegada esperada (pedido + mediana) já passou.<\u002Fspan><\u002Fspan><\u002Fdiv><div style=\"font-size:30px;font-weight:800;margin-top:4px;color:#D92D20\">10<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #EAE5DE;border-radius:16px;padding:18px 22px\"><div style=\"font-size:13px;color:#6F675F\">Maior P90<span class=\"tt\" style=\"display:inline-flex;width:16px;height:16px;border-radius:99px;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-left:6px;cursor:help;text-transform:none;letter-spacing:0;vertical-align:middle;background:#EAE5DE;color:#5E564E\">i<span class=\"tip r\">Prazo dentro do qual 9 de cada 10 pedidos chegam.<\u002Fspan><\u002Fspan><\u002Fdiv><div style=\"font-size:30px;font-weight:800;margin-top:4px\">75 d <span style=\"font-size:14px;font-weight:600;color:#6F675F\">F05<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #EAE5DE;border-radius:16px;overflow:hidden\">\n<div style=\"padding:18px 22px 4px\"><div style=\"font-size:17px;font-weight:700\">Lead time e pedidos em aberto<\u002Fdiv><div style=\"font-size:13px;color:#6F675F;margin-top:4px\">Barra roxa: tempo típico (mediana). Barra clara: dias extras até o P90, o pior caso comum (9 em cada 10 pedidos chegam até aí). Atrasado = PO cuja chegada esperada (pedido + mediana) já passou.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:230px 1fr 64px 64px 76px 56px 70px 80px;gap:14px;padding:14px 22px 12px;border-bottom:1px solid #EAE5DE;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#6F675F\"><span>Fornecedor<\u002Fspan><span>Mediana até o P90 · variação<span class=\"tt\" style=\"display:inline-flex;width:16px;height:16px;border-radius:99px;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-left:6px;cursor:help;text-transform:none;letter-spacing:0;vertical-align:middle;background:#EAE5DE;color:#5E564E\">i<span class=\"tip b\">Variação = quanto o P90 passa da mediana. Acima de 180% o fornecedor é marcado como instável.<\u002Fspan><\u002Fspan><\u002Fspan><span style=\"text-align:right\">Mediana<\u002Fspan><span style=\"text-align:right\">P90<\u002Fspan><span style=\"text-align:right\">Pedidos<\u002Fspan><span style=\"text-align:right\">SKUs<\u002Fspan><span style=\"text-align:right\">Abertos<\u002Fspan><span style=\"text-align:right\">Atrasados<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{ sups }}\" as=\"s\" hint-placeholder-count=\"6\"><div style=\"display:grid;grid-template-columns:230px 1fr 64px 64px 76px 56px 70px 80px;gap:14px;padding:16px 22px;border-bottom:1px solid #F0EBE4;align-items:center;font-size:14px;background:{{ s.bg }}\"><div><div style=\"font-weight:700\">{{ s.id }} · {{ s.name }}<\u002Fdiv><span class=\"tt\" style=\"display:{{ s.ud }};font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:#FDECEA;color:#B42318;cursor:help\">instável<span class=\"tip b l\">O agente antecipa emissões deste fornecedor quando a chegada pelo P90 cai depois da campanha.<\u002Fspan><\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:10px\"><div style=\"flex:1;height:12px;background:#F5F1EB;border-radius:6px;position:relative;overflow:hidden\"><div style=\"position:absolute;left:0;top:0;bottom:0;width:{{ s.p }};background:{{ s.bar }}\"><\u002Fdiv><div style=\"position:absolute;left:0;top:0;bottom:0;width:{{ s.m }};background:#5B2A55\"><\u002Fdiv><\u002Fdiv><span style=\"width:46px;text-align:right;font-size:13px;font-weight:700;color:{{ s.vc }}\">{{ s.var }}<\u002Fspan><\u002Fdiv><span style=\"text-align:right;font-weight:600\">{{ s.med }}<\u002Fspan><span style=\"text-align:right\">{{ s.p90 }}<\u002Fspan><span style=\"text-align:right;color:#5E564E\">{{ s.n }}<\u002Fspan><span style=\"text-align:right;color:#5E564E\">{{ s.sk }}<\u002Fspan><span style=\"text-align:right\">{{ s.po }}<\u002Fspan><span style=\"text-align:right\"><span style=\"display:inline-block;min-width:24px;text-align:center;font-weight:700;padding:2px 8px;border-radius:99px;background:{{ s.ab }};color:{{ s.ac }}\">{{ s.at }}<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:28px 4px;color:#1C1917;display:flex;flex-direction:column;gap:14px;align-self:start;position:sticky;top:24px\"><div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5B2A55\">Decisões · Fornecedores<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:12px\"><div style=\"font-size:14.5px;line-height:1.55;color:#3D372F\">Três cartões resumem o conjunto (90 POs, 10 atrasados, maior P90).<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:#3D372F\">O alerta do F05 virou um aviso âmbar com o contraste necessário, e a linha do fornecedor tem fundo levemente destacado.<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:#3D372F\">Mediana e P90 viraram uma barra única: a parte roxa é o tempo típico e a parte clara são os dias extras até o pior caso comum, com a variação em % ao lado. Mín–máx foi removido, por não apoiar decisão. O F05 salta aos olhos (+134%).<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:#3D372F\">Atrasados usa etiqueta vermelha apenas quando maior que zero; zero fica em cinza.<\u002Fdiv><\u002Fdiv><div style=\"font-size:14px;line-height:1.5;font-weight:600;background:#F3E9F1;color:#3E1A3A;border-radius:12px;padding:12px 14px\">Os números continuam ao lado da faixa, então nada se perde.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n<!-- 1f -->\n<div id=\"1f\" style=\"display:grid;grid-template-columns:1280px 340px;gap:12px 32px;flex:none;width:1652px\">\n<div style=\"grid-column:1/-1;font-size:14px;font-weight:700\"><span style=\"background:#5B2A55;color:#fff;border-radius:6px;padding:3px 8px;margin-right:8px\">1f<\u002Fspan>Dados e configuração<\u002Fdiv>\n<div style=\"width:1280px;min-height:860px;background:#FAF8F5;border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 12px 40px rgba(60,40,20,.12);display:flex;overflow:hidden;color:#1C1917\">\n<div style=\"width:232px;flex:none;background:#fff;border-right:1px solid #EAE5DE;padding:24px 16px;display:flex;flex-direction:column;gap:4px;box-sizing:border-box\">\n<div style=\"font-size:20px;font-weight:800;letter-spacing:-.02em;padding:0 12px 20px\">GoStock<\u002Fdiv>\n<sc-for list=\"{{ nav6 }}\" as=\"n\" hint-placeholder-count=\"6\"><div style=\"display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;font-size:15px;font-weight:{{ n.w }};background:{{ n.bg }};color:{{ n.c }}\"><span>{{ n.label }}<\u002Fspan><span style=\"display:{{ n.cd }};font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:{{ n.pb }};color:{{ n.pc }}\">{{ n.count }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<div style=\"margin-top:auto;padding:14px;border-radius:12px;background:#F5F1EB;font-size:13px;line-height:1.45;color:#5E564E\"><div style=\"font-weight:700;color:#1C1917\">Dados padrão<\u002Fdiv>Referência 29/09/2026<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1;padding:36px 40px 0;display:flex;flex-direction:column;gap:20px;min-width:0\">\n<div><h2 style=\"font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0\">Dados e configuração<\u002Fh2><div style=\"font-size:15px;color:#6F675F;margin-top:6px\">Envie os CSVs do seu estoque ou ajuste os parâmetros do plano.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1.1fr;gap:20px;align-items:flex-start\">\n<div style=\"display:flex;flex-direction:column;gap:20px\">\n<div style=\"background:#fff;border:1px solid #EAE5DE;border-radius:16px;padding:20px 22px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><div style=\"font-size:17px;font-weight:700\">Dados em uso<\u002Fdiv><span style=\"font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:#F0EBE4;color:#5E564E\">padrão<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px\">\n<sc-for list=\"{{ inUse }}\" as=\"u\"><div><div style=\"font-size:12.5px;color:#6F675F\">{{ u.l }}<\u002Fdiv><div style=\"font-size:16px;font-weight:700\">{{ u.v }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:12.5px;color:#6F675F;margin-top:12px\">656 linhas de venda duplicadas removidas<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #EAE5DE;border-radius:16px;padding:20px 22px\">\n<div style=\"font-size:17px;font-weight:700\">Enviar CSVs<\u002Fdiv>\n<div style=\"font-size:13px;color:#6F675F;margin:4px 0 14px;line-height:1.45\">Processados no navegador, sem envio a servidor. O agente recebe só o resumo por SKU.<\u002Fdiv>\n<div style=\"border:2px dashed #CFC6B9;border-radius:14px;padding:22px;text-align:center;background:#FBF9F6\"><div style=\"font-size:15px;font-weight:700\">Arraste os cinco arquivos aqui<\u002Fdiv><div style=\"font-size:13px;color:#6F675F;margin-top:4px\">ou <a href=\"#1f\" style=\"font-weight:600\">escolha do computador<\u002Fa><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;margin-top:14px\">\n<sc-for list=\"{{ files }}\" as=\"f\"><div style=\"display:flex;align-items:center;gap:10px;font-size:14px;padding:9px 12px;border-radius:10px;background:#FAF8F5\"><span style=\"width:16px;height:16px;border-radius:99px;border:2px solid #BDB4A8;box-sizing:border-box\"><\u002Fspan><span style=\"font-weight:600\">{{ f }}<\u002Fspan><span style=\"margin-left:auto;font-size:12.5px;color:#8A8177\">faltando<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:12px;margin-top:16px\"><div style=\"background:#D8D1C7;color:#6F675F;font-weight:700;font-size:14px;padding:11px 18px;border-radius:12px\">Processar<\u002Fdiv><span style=\"font-size:13px;color:#6F675F\">Envie os 5 arquivos para liberar<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #EAE5DE;border-radius:16px;padding:6px 22px\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;padding:16px 0 4px\"><div style=\"font-size:17px;font-weight:700\">Configuração<\u002Fdiv><span style=\"font-size:13.5px;font-weight:600;color:#5B2A55\">Restaurar padrão<\u002Fspan><\u002Fdiv>\n<div style=\"font-size:13px;color:#6F675F;padding-bottom:10px\">Plano e metas valem na hora. Processamento vale no próximo envio de CSVs.<\u002Fdiv>\n<sc-for list=\"{{ cfg }}\" as=\"g\"><div style=\"border-top:1px solid #F0EBE4;padding:16px 0\">\n<div style=\"display:flex;justify-content:space-between;align-items:center\"><div style=\"font-size:15px;font-weight:700\">{{ g.title }}<\u002Fdiv><span style=\"font-size:12.5px;color:#6F675F\">{{ g.hint }}<\u002Fspan><\u002Fdiv>\n<div style=\"display:{{ g.fd }};grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:12px\">\n<sc-for list=\"{{ g.fields }}\" as=\"f\"><div><div style=\"font-size:12.5px;font-weight:600;color:#5E564E;margin-bottom:5px\">{{ f.l }}<\u002Fdiv><div style=\"border:1px solid #D8D1C7;border-radius:10px;padding:9px 12px;font-size:14.5px;background:#fff;display:flex;justify-content:space-between\"><span>{{ f.v }}<\u002Fspan><span style=\"color:#8A8177\">{{ f.s }}<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:sticky;bottom:0;margin:0 -40px;padding:14px 40px;background:#fff;border-top:1px solid #EAE5DE;display:flex;align-items:center;gap:14px;margin-top:auto\"><div style=\"background:#5B2A55;color:#fff;font-weight:700;font-size:14px;padding:11px 18px;border-radius:12px\">Aplicar ao plano<\u002Fdiv><span style=\"font-size:13px;color:#6F675F\">Campos de processamento ficam travados até enviar os CSVs.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:28px 4px;color:#1C1917;display:flex;flex-direction:column;gap:14px;align-self:start;position:sticky;top:24px\"><div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5B2A55\">Decisões · Dados e configuração<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:12px\"><div style=\"font-size:14.5px;line-height:1.55;color:#3D372F\">A tela passa de uma coluna longa para duas: dados e envio de um lado, configuração do outro.<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:#3D372F\">O envio tem uma área de arrastar os cinco arquivos e uma lista de status, no lugar de cinco seletores nativos repetidos.<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:#3D372F\">A configuração é dividida em seções: Plano de compras, Metas de serviço e Campanhas, cada uma marcada como valendo na hora. Processamento fica recolhido e travado, com o motivo explícito.<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:#3D372F\">A barra de ação fixa no rodapé mantém \"Aplicar ao plano\" sempre visível. \"Restaurar padrão\" ficou perto do título da configuração.<\u002Fdiv><\u002Fdiv><div style=\"font-size:14px;line-height:1.5;font-weight:600;background:#F3E9F1;color:#3E1A3A;border-radius:12px;padding:12px 14px\">Menos campos visíveis por vez, e cada grupo diz quando seu efeito começa.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  navList(active) {\n    const items = [['Visão geral',''],['Plano de compras','135'],['Liquidação','87'],['Estoque',''],['Fornecedores','1'],['Dados','']];\n    return items.map((it, i) => ({\n      label: it[0], count: it[1], cd: it[1] ? 'inline-block' : 'none',\n      bg: i === active ? '#F3E9F1' : 'transparent', c: i === active ? '#5B2A55' : '#4A433C', w: i === active ? 700 : 500,\n      pb: i === 4 ? '#FDECEA' : '#F0EBE4', pc: i === 4 ? '#B42318' : '#5E564E'\n    }));\n  }\n  tabs(list) { return list.map((l, i) => ({ l, bg: i === 0 ? '#1C1917' : '#fff', c: i === 0 ? '#fff' : '#4A433C', b: i === 0 ? '#1C1917' : '#D8D1C7' })); }\n  renderVals() {\n    const X = v => 48 + v / 6 * 632, Y = p => 230 - (p - 70) / 30 * 200;\n    const pts = [[0.5,74],[1,77.7],[1.5,83.5],[2,89.5],[3,96.2],[4,98.7],[5,98.7],
